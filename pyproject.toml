[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse-copilot"
version = "1.0.0"
description = "Market analytics for stocks, indexes and portfolios, with optional LLM research tools (FastAPI + React)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
# Vector search for the optional AI features (MARKETPULSE_AI_ENABLED=1).
ai = ["chromadb>=0.5"]
# Real FinBERT sentiment (heavy: pulls in torch). Without this installed,
# marketpulse.nlp.sentiment automatically falls back to a lexicon scorer.
nlp = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

# Vercel: the app has CORS middleware, which would otherwise keep the React build
# inside the function; static files don't need CORS, so serve them from the CDN.
[tool.vercel.fastapi.static]
cdn = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff]
line-length = 120
