# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: marketpulse-copilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set it in the Render dashboard, never in git
      - key: SEC_USER_AGENT
        sync: false
      - key: MARKETPULSE_TICKERS
        value: AAPL,MSFT,JPM,NVDA,GS
      - key: MARKETPULSE_MAX_CLIENT_LLM_CALLS
        value: "15"
      - key: MARKETPULSE_MAX_DAILY_LLM_CALLS
        value: "150"
